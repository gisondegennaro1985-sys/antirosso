<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Non Andare In Rosso</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antirosso">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>Antirosso</h1>
        <p id="cycle-dates" class="subtitle">Ciclo in corso...</p>
      </div>
    </header>

    <main class="app-main">
      <section class="hero-card" id="hero-card">
        <div class="hero-label">Quanto posso spendere oggi?</div>
        <div class="hero-amount" id="daily-budget">€ 0,00</div>
        <div class="hero-status-tag" id="status-tag">In bilancio</div>
      </section>

      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Fondo Mese</span>
          <span class="stat-value" id="monthly-fund">€ 0,00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Giorni Rim.</span>
          <span class="stat-value" id="days-remaining">0</span>
        </div>
      </section>

      <section class="action-card">
        <h3>Aggiungi Spesa</h3>
        <form id="expense-form">
          <div class="input-group">
            <input type="number" id="expense-amount" placeholder="0.00" step="0.01" required>
            <span class="currency-symbol">€</span>
          </div>
          
          <div class="segmented-control">
            <input type="radio" name="payment-method" id="pay-debit" value="debit" checked>
            <label for="pay-debit">Contanti / Bancomat</label>
            
            <input type="radio" name="payment-method" id="pay-credit" value="credit">
            <label for="pay-credit">Carta di Credito</label>
          </div>

          <button type="submit" class="btn-primary">Registra Spesa</button>
        </form>
      </section>

      <section class="piggy-bank-card">
        <div class="piggy-header">
          <div>
            <h3>Salvadanaio Risparmi</h3>
            <p class="piggy-subtitle">Risparmi accumulati dai giorni precedenti</p>
          </div>
          <div class="piggy-amount" id="piggy-amount">€ 0,00</div>
        </div>
      </section>

      <section class="settings-card">
        <h3>Impostazioni Ciclo Mensile</h3>
        <form id="salary-form">
          <div class="form-field">
            <label for="salary-amount">Stipendio (23 del mese)</label>
            <input type="number" id="salary-amount" placeholder="Es. 1800.00" step="0.01" required>
          </div>
          <div class="form-field">
            <label for="fixed-expenses">Spese Fisse Mensili</label>
            <input type="number" id="fixed-expenses" placeholder="Es. 650.00" step="0.01" required>
          </div>
          <button type="submit" class="btn-secondary">Aggiorna Fondo Mensile</button>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato:', reg))
          .catch(err => console.error('Errore SW:', err));
      });
    }
  </script>
</body>
</html>
